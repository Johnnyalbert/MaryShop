<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mary's Make Up | Tienda Oficial</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe4ed 100%);
            color: #4a2c3a;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fce4ec;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #f5a0b9, #d4af37);
            border-radius: 10px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0;
            }
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #e91e63, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 24px;
            color: #e91e63;
            transition: transform 0.3s ease;
        }

        .cart-icon:hover {
            transform: scale(1.1);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -15px;
            background: linear-gradient(135deg, #e91e63, #d4af37);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #ff69b4, #e91e63, #d4af37);
            margin: 20px;
            border-radius: 25px;
            padding: 50px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 40px rgba(233, 30, 99, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1%, transparent 1%);
            background-size: 50px 50px;
            animation: shimmer 20s linear infinite;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-family: 'Playfair Display', serif;
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s ease;
        }

        .phrase-container {
            max-width: 700px;
            margin: 1.5rem auto 0;
            min-height: 80px;
            position: relative;
            z-index: 1;
        }

        .rotating-phrase {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
            font-style: italic;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            padding: 0.8rem 1.5rem;
            border-radius: 3rem;
            display: inline-block;
        }

        .container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #c2185b, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(233, 30, 99, 0.15);
            border-color: #d4af37;
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #c2185b;
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e91e63, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.5rem 0;
        }

        .add-to-cart {
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 14px;
        }

        .add-to-cart:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
            background: linear-gradient(135deg, #d4af37, #e91e63);
            gap: 0.8rem;
        }

        .add-to-cart:active {
            transform: scale(0.95);
        }

        .cart-sidebar {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100%;
            background: linear-gradient(135deg, #fff5f8, #ffffff);
            padding: 25px;
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: -5px 0 30px rgba(233, 30, 99, 0.15);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #fce4ec;
        }

        .cart-header h2 {
            color: #c2185b;
            font-size: 1.5rem;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #e91e63;
            transition: transform 0.3s;
        }

        .close-cart:hover {
            transform: rotate(90deg);
        }

        .cart-items {
            flex: 1;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #fce4ec;
            animation: slideIn 0.3s ease;
        }

        .cart-item-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
        }

        .cart-total {
            font-size: 1.3rem;
            font-weight: 700;
            padding: 15px 0;
            border-top: 2px solid #fce4ec;
            color: #c2185b;
            text-align: center;
        }

        .checkout-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            transition: all 0.3s;
        }

        .overlay.active {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1002;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(0);
        }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-decoration: none;
            animation: pulse 2s infinite;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: fadeInUp 0.4s ease;
        }

        .modal-content h3 {
            color: #c2185b;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }

        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #fce4ec;
            border-radius: 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .modal-content input:focus {
            border-color: #e91e63;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #4a2c3a;
        }

        .btn-confirm:hover, .btn-cancel:hover {
            transform: scale(1.02);
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 12px 20px;
            }
            .logo {
                font-size: 18px;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .rotating-phrase {
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
            }
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
            .section-title {
                font-size: 1.6rem;
            }
            .products-grid {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">
        <i class="fas fa-heart"></i> Mary's Make Up
    </div>
    <div class="cart-icon" id="cartIcon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<div class="hero">
    <h1>✨ Mary's Make Up ✨</h1>
    <div class="phrase-container">
        <div class="rotating-phrase" id="rotatingPhrase">💄 Belleza que empodera</div>
    </div>
</div>

<div class="container">
    <h2 class="section-title">🌸 Nuestros Productos</h2>
    <div class="products-grid" id="productsGrid"></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h2><i class="fas fa-shopping-bag"></i> Mi Carrito</h2>
        <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total" id="cartTotal">Total: $0 CUP</div>
    <button class="checkout-btn" id="checkoutBtn"><i class="fab fa-whatsapp"></i> Finalizar por WhatsApp</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3>📋 Información de envío</h3>
        <input type="text" id="customerName" placeholder="Tu nombre completo" autocomplete="off">
        <input type="text" id="customerAddress" placeholder="Tu dirección (municipio, ciudad, calle, #)" autocomplete="off">
        <div class="modal-buttons">
            <button class="btn-cancel" id="cancelModal">Cancelar</button>
            <button class="btn-confirm" id="confirmModal">Enviar pedido</button>
        </div>
    </div>
</div>

<a href="https://wa.me/5351949771" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
</a>

<div class="toast" id="toast">✅ Producto agregado</div>

<script>
    // Frases de maquillaje
    const makeupPhrases = [
        "💄 El maquillaje es el arte de realzar la belleza interior",
        "✨ Una mujer con maquillaje es como una obra de arte",
        "💋 El rubor es la sonrisa de las mejillas",
        "👁️ Los ojos son el espejo del alma, resáltalos",
        "🌟 La belleza comienza en el momento que decides ser tú misma",
        "💎 El maquillaje no cambia quién eres, solo muestra quién quieres ser",
        "🌸 Una pizca de brillo nunca está de más",
        "💕 El maquillaje perfecto es el que te hace sentir poderosa"
    ];

    let currentPhraseIndex = 0;
    const phraseElement = document.getElementById('rotatingPhrase');

    function rotatePhrase() {
        phraseElement.style.opacity = '0';
        setTimeout(() => {
            currentPhraseIndex = (currentPhraseIndex + 1) % makeupPhrases.length;
            phraseElement.textContent = makeupPhrases[currentPhraseIndex];
            phraseElement.style.opacity = '1';
        }, 400);
    }

    setInterval(rotatePhrase, 3000);

    // PRODUCTOS CON TUS IMÁGENES DE DRIVE (enlaces directos)
    const products = [
        { id: 1, name: "Mascarilla peel off brillo con carbón y colágeno", price: 3000, image: "https://drive.google.com/uc?export=view&id=1-29uzR41x3cLCQrgKH2o0QMan0WIbZ2d", description: "Limpieza profunda + brillo instantáneo" },
        { id: 2, name: "Mascarilla peel off de Granada", price: 3000, image: "https://drive.google.com/uc?export=view&id=1-2ZSzkEd7Bvn-yOXHNqZHBR8q4EIy_Ux", description: "Antioxidantes, hidratación y luminosidad" },
        { id: 3, name: "Serum de baba de caracol 100ml", price: 2500, image: "https://drive.google.com/uc?export=view&id=1-4Jyuo2MWkxWhXhiJz_OqH2fQD2rUF52", description: "Rejuvenece, repara y regenera la piel" },
        { id: 4, name: "Serum de Granada 100ml", price: 2500, image: "https://drive.google.com/uc?export=view&id=1-5jjcrrTfHuWRe2r0b73u67EQBeuzfCY", description: "Hidratación profunda y antioxidante" },
        { id: 5, name: "Crema blanqueadora para el rostro", price: 1800, image: "https://drive.google.com/uc?export=view&id=1-5jxYdaQb4wWc5KCTD1cLU_eXfYllvER", description: "Unifica el tono, reduce manchas" },
        { id: 6, name: "Serum blanqueador de vitamina C", price: 2200, image: "https://drive.google.com/uc?export=view&id=1-7oh6sCdsfRTfRE9Jt1H8cp7sJeI14av", description: "Aclara, ilumina y previene arrugas" },
        { id: 7, name: "Limpiador de vitamina C", price: 1500, image: "https://drive.google.com/uc?export=view&id=1-8iGUFlNL0xfYoW9I5ZwEPncjkMFIwSY", description: "Limpieza suave + efecto luminoso" }
    ];

    let cart = JSON.parse(localStorage.getItem('marysCart')) || [];

    function saveCart() {
        localStorage.setItem('marysCart', JSON.stringify(cart));
        updateCartUI();
    }

    function updateCartUI() {
        const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').innerText = cartCount;

        const cartItemsDiv = document.getElementById('cartItems');
        const cartTotalSpan = document.getElementById('cartTotal');
        
        if(cart.length === 0) {
            cartItemsDiv.innerHTML = '<p style="text-align:center; color:#f5a0b9; padding:20px;">✨ Tu necesitas un poco de magia aquí ✨</p>';
            cartTotalSpan.innerText = 'Total: $0 CUP';
            return;
        }

        cartItemsDiv.innerHTML = '';
        let total = 0;
        cart.forEach(item => {
            total += item.price * item.quantity;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'cart-item';
            itemDiv.innerHTML = `
                <img src="${item.image}" class="cart-item-img" alt="${item.name}">
                <div class="cart-item-info">
                    <h4 style="color:#c2185b; margin-bottom:5px;">${item.name}</h4>
                    <p style="color:#e91e63;">$${item.price.toFixed(2)} CUP x ${item.quantity}</p>
                    <small style="color:#d4af37;">Subtotal: $${(item.price * item.quantity).toFixed(2)} CUP</small>
                </div>
                <button onclick="removeFromCart(${item.id})" style="background:#e91e63; border:none; color:white; padding:0.5rem 1rem; border-radius:1rem; cursor:pointer; font-weight:600;">Eliminar</button>
            `;
            cartItemsDiv.appendChild(itemDiv);
        });
        cartTotalSpan.innerText = `Total: $${total.toFixed(2)} CUP`;
    }

    function addToCart(product) {
        const existing = cart.find(item => item.id === product.id);
        if(existing) {
            existing.quantity++;
        } else {
            cart.push({ ...product, quantity: 1 });
        }
        saveCart();
        showToast(`${product.name} agregado a tu neceser`);
    }

    window.removeFromCart = function(id) {
        cart = cart.filter(item => item.id !== id);
        saveCart();
        if(cart.length === 0) {
            document.getElementById('cartSidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = `💄 ${message}`;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        products.forEach((product, index) => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.style.animationDelay = `${index * 0.05}s`;
            card.innerHTML = `
                <img src="${product.image}" class="product-img" alt="${product.name}">
                <div class="product-info">
                    <h3 class="product-title">${product.name}</h3>
                    <p style="color:#f5a0b9; font-size:0.85rem; margin-bottom:10px;">${product.description}</p>
                    <div class="product-price">$${product.price.toFixed(2)} CUP</div>
                    <button class="add-to-cart" data-id="${product.id}">
                        <i class="fas fa-cart-plus"></i> Añadir al carrito
                    </button>
                </div>
            `;
            grid.appendChild(card);
            
            const btn = card.querySelector('.add-to-cart');
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                addToCart(product);
                animateButton(btn);
            });
        });
    }

    function animateButton(btn) {
        btn.style.transform = 'scale(0.95)';
        setTimeout(() => {
            btn.style.transform = 'scale(1)';
        }, 150);
    }

    function openCheckoutModal() {
        if(cart.length === 0) {
            showToast("¡Agrega productos a tu neceser primero!");
            return;
        }
        document.getElementById('modal').classList.add('active');
    }

    function sendOrderToWhatsApp() {
        const name = document.getElementById('customerName').value.trim();
        const address = document.getElementById('customerAddress').value.trim();

        if(name === "" || address === "") {
            showToast("⚠️ Por favor, completa tu nombre y dirección");
            return;
        }

        let message = "💄 *NUEVO PEDIDO - Mary's Make Up* 💄%0A%0A";
        message += `👤 *Cliente:* ${name}%0A`;
        message += `📍 *Dirección:* ${address}%0A%0A`;
        message += "📦 *PRODUCTOS:*%0A";
        
        let total = 0;
        
        cart.forEach(item => {
            message += `✨ ${item.name} x${item.quantity} → $${(item.price * item.quantity).toFixed(2)} CUP%0A`;
            total += item.price * item.quantity;
        });
        
        message += `%0A💰 *TOTAL: $${total.toFixed(2)} CUP*%0A%0A`;
        message += `🙏 ¡Gracias por tu compra! 💖`;
        
        document.getElementById('modal').classList.remove('active');
        document.getElementById('cartSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('customerName').value = '';
        document.getElementById('customerAddress').value = '';
        
        window.open(`https://wa.me/5351949771?text=${message}`, '_blank');
    }

    document.getElementById('cartIcon').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.add('open');
        document.getElementById('overlay').classList.add('active');
    });

    document.getElementById('closeCartBtn').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
    });

    document.getElementById('overlay').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
    });

    document.getElementById('checkoutBtn').addEventListener('click', openCheckoutModal);
    document.getElementById('confirmModal').addEventListener('click', sendOrderToWhatsApp);
    document.getElementById('cancelModal').addEventListener('click', () => {
        document.getElementById('modal').classList.remove('active');
        document.getElementById('customerName').value = '';
        document.getElementById('customerAddress').value = '';
    });

    renderProducts();
    updateCartUI();
</script>
</body>
</html>
