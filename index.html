<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mary's Make Up | Tienda Oficial</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Mi CSS -->
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<div class="navbar">
    <div class="logo">
        <i class="fas fa-heart"></i> Mary's Make Up
    </div>
    <div class="cart-icon" id="cartIcon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<div class="hero">
    <h1>✨ Mary's Make Up ✨</h1>
    <div class="phrase-container">
        <div class="rotating-phrase" id="rotatingPhrase">💄 Belleza que empodera</div>
    </div>
</div>

<div class="container">
    <h2 class="section-title">🌸 Nuestros Productos</h2>
    <div class="filters-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar productos...">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="mascarilla">Mascarillas</button>
            <button class="filter-btn" data-filter="serum">Serums</button>
            <button class="filter-btn" data-filter="crema">Cremas</button>
            <button class="filter-btn" data-filter="limpiador">Limpiadores</button>
        </div>
    </div>
    <div class="products-grid" id="productsGrid"></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h2><i class="fas fa-shopping-bag"></i> Mi Carrito</h2>
        <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total" id="cartTotal">Total: $0 CUP</div>
    <button class="checkout-btn" id="checkoutBtn"><i class="fab fa-whatsapp"></i> Finalizar por WhatsApp</button>
    <button class="clear-cart-btn" id="clearCartBtn"><i class="fas fa-trash-alt"></i> Vaciar Carrito</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3>📋 Información de envío</h3>
        <input type="text" id="customerName" placeholder="Tu nombre completo" autocomplete="off">
        <input type="text" id="customerAddress" placeholder="Tu dirección" autocomplete="off">
        <div class="modal-buttons">
            <button class="btn-cancel" id="cancelModal">Cancelar</button>
            <button class="btn-confirm" id="confirmModal">Enviar pedido</button>
        </div>
    </div>
</div>

<a href="https://wa.me/5351949771" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
</a>
g4
<div class="toast" id="toast">✅ Producto agregado</div>

<script src="scripts/script.js"></script>
</body>
</html>
